{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "octroi-common.fullname" . }}
  labels:
    {{- include "octroi-common.labels" . | nindent 4 }}
type: Opaque
stringData:
  OCTROI_DISPATCHER_ENROLMENT_TOKEN: {{ .Values.secrets.enrolmentToken | quote }}
{{- end }}
